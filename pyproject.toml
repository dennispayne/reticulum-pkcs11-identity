[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reticulum-pkcs11-identity"
version = "0.1.0"
description = "PKCS#11 hardware-backed identity support for Reticulum"
readme = "README.md"
license = { text = "MIT with non-harm clause (see LICENSE)" }
requires-python = ">=3.10"
keywords = ["reticulum", "pkcs11", "identity", "hardware", "hsm", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "rns>=0.7.0",
    "python-pkcs11>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Developer tooling. Pyright is the type checker the committed [tool.pyright]
# config targets (Pylance bundles the same engine in-editor); installing it
# here makes the configured baseline reproducible from the command line.
dev = [
    "pyright>=1.1.400",
]
# System dependencies for full test suite (not installable via pip):
# - SoftHSM2: softhsm2-util and libsofthsm2.so (required for PKCS#11 tests)
#   Install with: apt-get install softhsm2 (Linux)
#                 choco install softhsm2 (Windows)
#                 brew install softhsm (macOS)

[project.scripts]
rnidstatus = "reticulum_pkcs11_identity.cli:main"
rnidsetup = "reticulum_pkcs11_identity.session_bootstrap:main"

[project.urls]
Homepage = "https://github.com/dennispayne/reticulum-pkcs11-identity"
Issues = "https://github.com/dennispayne/reticulum-pkcs11-identity/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["reticulum_pkcs11_identity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Use a workspace-local base temp dir. This avoids a Windows-only crash where
# pytest's session teardown fails with PermissionError [WinError 5] trying to
# unlink the locked `pytest-current` junction under the system TEMP dir, which
# makes pytest exit non-zero and causes the VS Code Test Explorer to mark an
# otherwise-passing run as failed (all icons turn red).
addopts = "-v --basetemp=.pytest_tmp"
markers = [
    "backend: backend unit tests",
    "backend_piv: PIV backend specific tests",
    "backend_features: backend feature-availability tests",
    "backend_state: backend state-management tests",
    "backend_validation: backend input-validation tests",
    "backend_consistency: backend consistency tests",
    "primitives: low-level crypto primitive tests",
    "keygen: key generation tests",
    "recovery: error-recovery tests",
    "threading: thread-safety tests",
    "monitor: token monitor tests",
    "identity: hardware identity unit tests",
    "discovery: token discovery tests",
    "lifecycle: backend lifecycle tests",
    "session_manager: session manager integration tests",
    "integration: integration tests (slower, may require hardware)",
    "software: integration tests that run against a software token (SoftHSM2)",
    "hardware: integration tests that require a real hardware token (e.g. YubiKey)",
]

[tool.coverage.run]
source = ["reticulum_pkcs11_identity"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
# Type-checking baseline for this package. This file pins the policy so the
# Problems view is consistent for every contributor regardless of their
# personal `python.analysis.typeCheckingMode` setting.
#
# Rationale for "standard" rather than "strict": this package is a thin wrapper
# around two libraries that ship little or no type information — Reticulum (RNS,
# untyped) and python-pkcs11 (partial types). In strict mode ~84% of the
# diagnostics were `reportUnknown*` / `reportMissingParameterType` noise emitted
# purely because those third-party calls are untyped, which drowns out real
# findings. "standard" keeps the high-signal type checks while dropping that
# noise.
include = ["reticulum_pkcs11_identity"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# Opt back in to dead-code detection (off by default in "standard"). These are
# high-signal and low-false-positive, so they stay as errors.
reportUnusedImport = "error"
reportUnusedVariable = "error"

# python-pkcs11 exposes its crypto operations (sign / derive_key / the
# Attribute-keyed templates) through mixin classes and dynamic attributes that
# its shipped types do not describe, and RNS ships no types at all. Attribute-
# and argument-type inference across those boundaries is therefore unreliable
# and produces mostly false positives. The genuine defects these rules surfaced
# have been fixed in code; `reportCallIssue` and `reportReturnType` (which had
# no false positives here and caught real bugs) remain enabled.
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
# RNS.Identity is effectively untyped, so structural override checks against it
# are not meaningful.
reportIncompatibleMethodOverride = "none"
# tabulate / psutil are optional runtime deps imported under try/except
# ImportError; their stubs ship without source, which is expected here.
reportMissingModuleSource = "none"
