name: Tests and Coverage

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Run test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system test dependencies
        run: bash scripts/install_test_deps.sh

      - name: Install Python dependencies
        run: pip install -e ".[test]"

      - name: Run tests with coverage
        run: python3 -m pytest tests/ -v --cov=reticulum_pkcs11_identity --cov-report=html --cov-report=term-missing --cov-report=json

      - name: Display coverage summary
        if: always()
        run: |
          python3 << 'EOF'
          import json
          import os
          
          # Read coverage.json
          if not os.path.exists('coverage.json'):
              print("coverage.json not found; skipping summary")
              raise SystemExit(0)
          with open('coverage.json') as f:
              coverage = json.load(f)
          
          # Extract total coverage percentage
          total_coverage = coverage['totals']['percent_covered']
          
          # Create summary with links
          summary = f"""## Coverage Report
          
          **Overall Coverage:** {total_coverage:.1f}%
          
          📊 [View detailed HTML report](https://dennispayne.github.io/reticulum-pkcs11-identity/coverage/index.html) (updated on main branch)
          
          💾 [Download HTML report from Artifacts](#artifacts)
          """
          
          # Write to GitHub step summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages/coverage
          cp -a htmlcov/. pages/coverage/
          cat > pages/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=coverage/index.html">
            <title>Coverage Report</title>
          </head>
          <body>
            <p>Redirecting to <a href="coverage/index.html">coverage report</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy-pages:
    name: Publish coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ format('{0}coverage/index.html', steps.deployment.outputs.page_url) }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
