name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system test dependencies
        run: bash scripts/install_test_deps.sh

      - name: Install Python dependencies
        run: pip install -e ".[test]"

      - name: Run tests with coverage
        run: python3 -m pytest tests/ -v --cov=reticulum_pkcs11_identity --cov-report=html --cov-report=term-missing --cov-report=json

      - name: Display coverage summary
        if: always()
        run: |
          python3 << 'EOF'
          import json
          import os
          
          # Read coverage.json
          if not os.path.exists('coverage.json'):
              print("coverage.json not found; skipping summary")
              raise SystemExit(0)
          with open('coverage.json') as f:
              coverage = json.load(f)
          
          # Extract total coverage percentage
          total_coverage = coverage['totals']['percent_covered']
          
          # Create summary with links
          summary = f"""## Coverage Report
          
          **Overall Coverage:** {total_coverage:.1f}%
          
          📊 [View detailed HTML report](https://dennispayne.github.io/reticulum-pkcs11-identity/coverage/index.html) (updated on main branch)
          
          💾 [Download HTML report from Artifacts](#artifacts)
          """
          
          # Write to GitHub step summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

      - name: Remove coverage ignore file for Pages publish
        if: always()
        run: rm -f htmlcov/.gitignore

      - name: Deploy coverage to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./htmlcov
          destination_dir: coverage
